services:
  - type: web
    name: t4kash-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_DATASOURCE_MAX_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_MIN_IDLE
        value: "1"
      - key: SPRING_DATASOURCE_CONNECTION_TIMEOUT
        value: "30000"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "t4kash-attachments"
      - key: APP_AUTH_EVALUATOR_EMAILS
        sync: false
      - key: APP_AUTH_ADMIN_EMAILS
        sync: false
      - key: APP_MAIL_ENABLED
        sync: false
      - key: APP_MAIL_PROVIDER
        value: "brevo"
      - key: APP_MAIL_FROM
        sync: false
      - key: APP_MAIL_FROM_NAME
        value: "T4KASH"
      - key: BREVO_API_KEY
        sync: false
      - key: APP_PUBLIC_BASE_URL
        value: "https://t4k4sh.onrender.com"
      - key: APP_DIDIT_ENABLED
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_DOCUMENT_HASH_SECRET
        sync: false
      - key: APP_PAYMENTS_PLATFORM_FEE_PERCENT
        value: "1.00"
      - key: APP_PAGADITO_ENABLED
        sync: false
      - key: APP_PAGADITO_ENVIRONMENT
        value: "SANDBOX"
      - key: APP_PAGADITO_ENDPOINT
        value: "https://sandbox.pagadito.com/comercios/wspg/charges.php"
      - key: PAGADITO_UID
        sync: false
      - key: PAGADITO_WSK
        sync: false
      - key: PAGADITO_PROCESSOR_FEE_PERCENT
        value: "0"
      - key: PAGADITO_PROCESSOR_FIXED_FEE
        value: "0"
      - key: PAGADITO_PROCESSOR_TAX_PERCENT
        value: "0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"

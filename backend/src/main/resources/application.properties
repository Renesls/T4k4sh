spring.application.name=t4kash-api
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/t4kash}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:t4kash}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:t4kash}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.secret-key=${SUPABASE_SECRET_KEY:}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:t4kash-attachments}
app.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
app.auth.evaluator-emails=${APP_AUTH_EVALUATOR_EMAILS:}
app.auth.admin-emails=${APP_AUTH_ADMIN_EMAILS:}
app.auth.verification-minutes=${APP_AUTH_VERIFICATION_MINUTES:15}
app.auth.verification-resend-seconds=${APP_AUTH_VERIFICATION_RESEND_SECONDS:60}
app.auth.two-factor-minutes=${APP_AUTH_TWO_FACTOR_MINUTES:10}
app.auth.password-reset-minutes=${APP_AUTH_PASSWORD_RESET_MINUTES:15}
app.auth.login-max-attempts=${APP_AUTH_LOGIN_MAX_ATTEMPTS:5}
app.auth.login-window-minutes=${APP_AUTH_LOGIN_WINDOW_MINUTES:15}
app.auth.login-lock-minutes=${APP_AUTH_LOGIN_LOCK_MINUTES:15}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.from=${APP_MAIL_FROM:${SMTP_USERNAME:}}
app.mail.from-name=${APP_MAIL_FROM_NAME:T4KASH}
app.mail.brevo-api-url=${BREVO_API_URL:https://api.brevo.com}
app.mail.brevo-api-key=${BREVO_API_KEY:}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.didit.enabled=${APP_DIDIT_ENABLED:false}
app.didit.api-url=${DIDIT_API_URL:https://verification.didit.me}
app.didit.api-key=${DIDIT_API_KEY:}
app.didit.workflow-id=${DIDIT_WORKFLOW_ID:}
app.didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
app.didit.document-hash-secret=${DIDIT_DOCUMENT_HASH_SECRET:}
app.didit.webhook-tolerance-seconds=${DIDIT_WEBHOOK_TOLERANCE_SECONDS:300}
app.payments.client-fee-percent=${APP_PAYMENTS_CLIENT_FEE_PERCENT:10.00}
app.payments.student-fee-percent=${APP_PAYMENTS_STUDENT_FEE_PERCENT:5.00}
app.pagadito.enabled=${APP_PAGADITO_ENABLED:false}
app.pagadito.environment=${APP_PAGADITO_ENVIRONMENT:SANDBOX}
app.pagadito.endpoint=${APP_PAGADITO_ENDPOINT:https://sandbox.pagadito.com/comercios/wspg/charges.php}
app.pagadito.uid=${PAGADITO_UID:}
app.pagadito.wsk=${PAGADITO_WSK:}
app.pagadito.processor-fee-percent=${PAGADITO_PROCESSOR_FEE_PERCENT:0}
app.pagadito.processor-fixed-fee=${PAGADITO_PROCESSOR_FIXED_FEE:0}
app.pagadito.processor-tax-percent=${PAGADITO_PROCESSOR_TAX_PERCENT:0}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:15000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

logging.level.root=INFO
logging.level.com.t4kash.api=DEBUG
